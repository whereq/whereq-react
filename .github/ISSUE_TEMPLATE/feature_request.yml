name: ✨ Feature request
description: Suggest a new component, prop, or improvement.
labels: ['enhancement', 'triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case / motivation — not just the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API / solution
      description: Sketch the component or prop. Code examples welcome.
      render: tsx
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a PR for this.

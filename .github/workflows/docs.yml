name: Docs

# Build the VitePress docs site + Storybook and deploy them to GitHub Pages.
# Docs live at the root; Storybook is nested at /storybook/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build docs (VitePress)
        run: pnpm run docs:build
      - name: Build Storybook
        run: pnpm run build-storybook
      - name: Nest Storybook under /storybook
        run: |
          mkdir -p docs/.vitepress/dist/storybook
          cp -r storybook-static/* docs/.vitepress/dist/storybook/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
